services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: travel_wishlist_api
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - ./backend:/var/www/html
    environment:
      DB_HOST: mysql
      DB_NAME: travel_wishlist_db
      DB_USER: travel_user
      DB_PASS: travel_password
      APP_URL: http://localhost:8090
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: travel_wishlist_mysql
    restart: unless-stopped
    ports:
      - "3308:3306"
    environment:
      MYSQL_DATABASE: travel_wishlist_db
      MYSQL_USER: travel_user
      MYSQL_PASSWORD: travel_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
