services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: travel_wishlist_api
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - ./backend:/var/www/html
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-travel_wishlist_db}
      DB_USER: ${DB_USER:-travel_user}
      DB_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD di file .env}
      APP_URL: ${APP_URL:-http://localhost:8090}
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: travel_wishlist_mysql
    restart: unless-stopped
    ports:
      - "3308:3306"
    environment:
      MYSQL_DATABASE: ${DB_NAME:-travel_wishlist_db}
      MYSQL_USER: ${DB_USER:-travel_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD di file .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Isi MYSQL_ROOT_PASSWORD di file .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
